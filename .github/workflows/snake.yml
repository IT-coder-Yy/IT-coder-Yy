name: Generate contribution snake

on:
  schedule:
    - cron: "47 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

concurrency:
  group: profile-readme-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate purple contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ede9fe,#c4b5fd,#8b5cf6,#6d28d9
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#1e2229,#3b105c,#5b21b6,#7c3aed,#c4b5fd

      - name: Commit the generated animations
        run: |
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No contribution snake changes to commit."
            exit 0
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update contribution snake"
          git push
